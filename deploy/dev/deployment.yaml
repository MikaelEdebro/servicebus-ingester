apiVersion: apps/v1
kind: Deployment
metadata:
  name: servicebus-ingester
  namespace: experiment
  labels:
    app: servicebus-ingester
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 100%
      maxSurge: 100%
  replicas: 2
  selector:
    matchLabels:
      app: servicebus-ingester
  template:
    metadata:
      labels:
        app: servicebus-ingester
        app.kubernetes.io/name: servicebus-ingester
        app.kubernetes.io/component: server
        log-source: dcsp-backend
        team: platform
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ingester
          image: acrvcedcsp.azurecr.io/experiment/ingestion/go-ingester:20260319.094200
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: global-env-config
            - configMapRef:
                name: servicebus-ingester-config
            - secretRef:
                name: servicebus-ingester-kv-experiment-config
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 768m
              memory: 768Mi
            requests:
              cpu: 50m
              memory: 256Mi
