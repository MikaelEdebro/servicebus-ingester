apiVersion: apps/v1
kind: Deployment
metadata:
  name: servicebus-ingester
  namespace: experiment
  labels:
    app: servicebus-ingester
spec:
  replicas: 2
  selector:
    matchLabels:
      app: servicebus-ingester
  template:
    metadata:
      labels:
        app: servicebus-ingester
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: ingester
          image: acrvcedcsp.azurecr.io/experiment/ingestion/go-ingester:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: servicebus-ingester-config
            - secretRef:
                name: servicebus-ingester-kv-experiment-config
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
